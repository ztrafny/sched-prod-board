<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board" aria-busy="true">
      <p data-testid="loader" class="loader" role="status">Loading incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" aria-live="polite"></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" aria-label="Incident" hidden>
      <button type="button" class="panel-close" aria-label="Close incident panel">×</button>
      <h2 class="panel-id"></h2>
      <p class="panel-what"></p>
      <button type="button" data-testid="panel-ack" class="panel-ack">Ack</button>
      <p class="panel-state" role="status"></p>
    </aside>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD__</code></footer>
  </body>
</html>
